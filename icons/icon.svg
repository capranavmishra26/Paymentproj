  <!-- day-wise columns: balance by day, red = fund required -->
  <rect x="96"  y="300" width="56" height="116" rx="10" fill="#9cc3e6"/>
  <rect x="176" y="262" width="56" height="154" rx="10" fill="#9cc3e6"/>
  <rect x="256" y="336" width="56" height="80"  rx="10" fill="#ff8a80"/>
  <rect x="336" y="244" width="56" height="172" rx="10" fill="#ffd54f"/>
